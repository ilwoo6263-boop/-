plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.wishfrequency.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.wishfrequency.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.2'
}

// ── 공유 웹앱(../web)을 앱의 assets/www 로 복사해서 번들에 포함 ──
def webSrcDir = file("${rootDir}/../web")
def webDstDir = file("src/main/assets/www")

tasks.register('copyWebAssets', Copy) {
    from webSrcDir
    into webDstDir
}
tasks.named('preBuild') {
    dependsOn 'copyWebAssets'
}
